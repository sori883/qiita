mcp_servers:
- atlassian
- awslabs.aws-documentation-mcp-server
- context7
- serena
- todoist
mcp_configs:
  atlassian:
    name: atlassian
    transport: stdio
    args:
    - -y
    - mcp-remote
    - https://mcp.atlassian.com/v1/sse
    registry: false
    command: npx
  awslabs.aws-documentation-mcp-server:
    name: awslabs.aws-documentation-mcp-server
    transport: stdio
    env:
      FASTMCP_LOG_LEVEL: ERROR
    args:
    - awslabs.aws-documentation-mcp-server@latest
    registry: false
    command: uvx
  context7:
    name: context7
    transport: http
    registry: false
    url: https://context7.liam.sh/mcp
  serena:
    name: serena
    transport: stdio
    args:
    - --from
    - git+https://github.com/oraios/serena
    - serena
    - start-mcp-server
    - --context
    - ide-assistant
    - --project
    - ./
    registry: false
    command: uvx
  todoist:
    name: todoist
    transport: stdio
    args:
    - -y
    - mcp-remote
    - https://ai.todoist.net/mcp
    registry: false
    command: npx
